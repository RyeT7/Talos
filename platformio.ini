; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
; serial monitor and upload both on COM8
monitor_speed = 115200
upload_port = COM8
upload_speed = 460800
monitor_port = COM8
; 16 MB flash with our own partition table so the app partition fits the voice clips
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; the voice clips go into the firmware, has to match EMBED_FILES in src/CMakeLists.txt
board_build.embed_files =
    src/voice/ac_off.wav
    src/voice/ac_on_16.wav
    src/voice/set_16.wav
    src/voice/set_19.wav
    src/voice/set_20.wav
    src/voice/set_21.wav
