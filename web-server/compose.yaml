services:
  db:
    container_name: talos-db
    image: postgres:17.11-alpine
    ports:
      - 15432:5432
    networks: [talos-network]
    volumes:
      - talos-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=talosdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    container_name: talos-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 4092:4092
    networks: [talos-network]
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/talosdb
    depends_on:
      db:
        condition: service_healthy

  models:
    container_name: talos-models
    build:
      context: ../model
      dockerfile: Dockerfile
    networks: [talos-network]
    environment:
      - MQTT_HOST=app
      - MQTT_PORT=4092
    depends_on:
      - app

volumes:
  talos-db:

networks:
  talos-network:
